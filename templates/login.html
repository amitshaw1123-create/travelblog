{% extends 'base.html' %}
{% block title %}Admin Login – WanderLog{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">

      <div class="card border-0 shadow">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="fas fa-compass display-4 text-warning"></i>
            <h3 class="mt-3 mb-1">Admin Login</h3>
            <p class="text-muted small">WanderLog management panel</p>
          </div>

          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="username" class="form-control" required autofocus
                       placeholder="admin" />
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control" required
                       placeholder="••••••••" />
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
              <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">
            <a href="{{ url_for('index') }}" class="text-muted">
              <i class="fas fa-arrow-left me-1"></i>Back to blog
            </a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
