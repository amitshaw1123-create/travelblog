# deploy/nginx.conf
# Install: sudo cp nginx.conf /etc/nginx/sites-available/wanderlog
#          sudo ln -sf /etc/nginx/sites-available/wanderlog /etc/nginx/sites-enabled/wanderlog
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl restart nginx

upstream wanderlog_app {
    server unix:/run/wanderlog/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;

    # server_name _ accepts all hostnames and IPs — no domain required.
    # Works with EC2 public IP and the long public DNS hostname.
    server_name _;

    access_log /var/log/nginx/wanderlog_access.log;
    error_log  /var/log/nginx/wanderlog_error.log warn;

    # Must match app.py MAX_CONTENT_LENGTH (200 MB) — nginx rejects uploads
    # larger than this before Flask ever sees them, causing a confusing 413.
    client_max_body_size 200M;

    # Match gunicorn timeout so nginx doesn't cut large uploads midway.
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    # ── Static files — served directly by nginx (fast, zero gunicorn load) ──
    location /static/ {
        alias /home/ubuntu/travel_blog/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # Prevent uploaded scripts from being executed via the web server.
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ── Favicon ───────────────────────────────────────────────────────────────
    location = /favicon.ico {
        alias /home/ubuntu/travel_blog/static/favicon.ico;
        log_not_found off;
        access_log    off;
    }

    # ── All other requests → gunicorn ────────────────────────────────────────
    location / {
        proxy_pass http://wanderlog_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering  off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header X-Frame-Options        "SAMEORIGIN"                        always;
    add_header X-XSS-Protection       "1; mode=block"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
}
