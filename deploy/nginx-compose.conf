# deploy/nginx-compose.conf
# nginx config used inside docker-compose (production-parity local setup).
# Key difference from nginx-docker.conf:
#   upstream = http://web:8000   (Docker service DNS, not 127.0.0.1)

upstream wanderlog_app {
    server web:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    # ── Static files served directly by nginx ─────────────────────────────────
    # Both containers share ./static via a bind mount (see docker-compose.yml).
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    location = /favicon.ico {
        alias /app/static/favicon.ico;
        log_not_found off;
        access_log    off;
    }

    # ── Dynamic requests → gunicorn (web service) ─────────────────────────────
    location / {
        proxy_pass http://wanderlog_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering  off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
