# deploy/nginx-docker.conf
# nginx config for Docker deployment.
# Installed by ec2-docker-setup.sh to /etc/nginx/sites-available/wanderlog
#
# Traffic flow:
#   Internet → nginx :80 → Docker container :8000 (gunicorn)
#
# Unlike the direct-EC2 config (nginx.conf), this proxies to a TCP port
# because Docker exposes gunicorn on 127.0.0.1:8000 (not a Unix socket).

server {
    listen 80;
    listen [::]:80;

    # Accepts any hostname or IP — works for EC2 public IP and DNS, no domain needed.
    server_name _;

    access_log /var/log/nginx/wanderlog_access.log;
    error_log  /var/log/nginx/wanderlog_error.log warn;

    # Must match app.py MAX_CONTENT_LENGTH (200 MB)
    client_max_body_size 200M;

    # Match gunicorn timeout (120s) for large uploads
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    # ── Static files — served directly from the host bind-mount ──────────────
    # The Docker container bind-mounts static/uploads from /home/ubuntu/data/uploads.
    # nginx serves all of /static/ directly, so gunicorn never handles asset requests.
    location /static/ {
        alias /home/ubuntu/travel_blog/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # Block any uploaded scripts from being executed via the web
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ── Uploads — served from the persistent data directory ──────────────────
    # Overrides the /static/uploads/ sub-path above so uploads survive re-deploys.
    location /static/uploads/ {
        alias /home/ubuntu/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ── Favicon ───────────────────────────────────────────────────────────────
    location = /favicon.ico {
        alias /home/ubuntu/travel_blog/static/favicon.ico;
        log_not_found off;
        access_log    off;
    }

    # ── All dynamic requests → Docker container on port 8000 ─────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering  off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
