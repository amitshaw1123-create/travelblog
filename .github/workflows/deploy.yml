name: Build & Deploy to EC2

on:
  push:
    branches: [main]        # triggers on every push to main

# Cancel any in-progress run for the same branch (avoids race conditions)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, push image, deploy
    runs-on: ubuntu-latest

    # Required to push to GitHub Container Registry (GHCR) using GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Docker buildx (enables caching + multi-platform if needed) ────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to GitHub Container Registry ───────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Build and push image to GHCR ──────────────────────────────────────
      # Image tag: ghcr.io/<owner>/<repo>:latest  (lowercased automatically)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # Layer cache: reuses unchanged layers from the previous build
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 5. SSH into EC2 and redeploy the container ───────────────────────────
      # Secrets required in repo Settings → Secrets and variables → Actions:
      #   EC2_HOST          — public IP of your EC2 instance
      #   EC2_SSH_KEY       — full contents of your .pem private key file
      #   SECRET_KEY        — Flask secret key (random 32-char hex string)
      #   ANTHROPIC_API_KEY — your Anthropic API key (sk-ant-...)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:     ${{ github.actor }}
          IMAGE:         ghcr.io/${{ github.repository }}
          SECRET_KEY:    ${{ secrets.SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     GHCR_TOKEN,GHCR_USER,IMAGE,SECRET_KEY,ANTHROPIC_KEY
          script: |
            set -euo pipefail

            # Lowercase the image name (GHCR requires lowercase)
            IMAGE_LC="${IMAGE,,}"

            echo "==> Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling latest image: $IMAGE_LC"
            docker pull "$IMAGE_LC:latest"

            echo "==> Stopping old container (if running)..."
            docker stop wanderlog 2>/dev/null || true
            docker rm   wanderlog 2>/dev/null || true

            echo "==> Starting new container..."
            docker run -d \
              --name wanderlog \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              -v /home/ubuntu/data/travel_blog.db:/app/travel_blog.db \
              -v /home/ubuntu/data/uploads:/app/static/uploads \
              -e GUNICORN_BIND=0.0.0.0:8000 \
              -e FLASK_ENV=production \
              -e SECRET_KEY="$SECRET_KEY" \
              -e ANTHROPIC_API_KEY="$ANTHROPIC_KEY" \
              "$IMAGE_LC:latest"

            echo "==> Removing dangling images to free disk space..."
            docker image prune -f

            echo "==> Container status:"
            docker ps --filter name=wanderlog --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
