name: Build & Deploy to ECS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build image → push ECR → deploy ECS
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Docker Buildx (layer caching) ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. AWS credentials ───────────────────────────────────────────────────
      # Required GitHub secrets:
      #   AWS_ACCESS_KEY_ID       — IAM user access key
      #   AWS_SECRET_ACCESS_KEY   — IAM user secret key
      #   AWS_REGION              — e.g. us-east-1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── 4. Log in to Amazon ECR ──────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. Build and push image to ECR ───────────────────────────────────────
      # Tags image with both the git SHA (immutable) and 'latest'
      # Required GitHub secret:
      #   ECR_REPOSITORY  — just the repo name, e.g. "wanderlog"
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 6. Render task definition with new image ─────────────────────────────
      # Secrets are injected via AWS Secrets Manager (see task definition)
      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs-task-definition.json
          container-name:  wanderlog
          image:           ${{ steps.build-image.outputs.image }}

      # ── 7. Deploy to ECS ──────────────────────────────────────────────────────
      # Registers the new task definition revision and updates the service.
      # Waits until the new tasks are healthy before marking the job as passed.
      # Required GitHub secrets:
      #   ECS_CLUSTER  — ECS cluster name, e.g. "wanderlog-cluster"
      #   ECS_SERVICE  — ECS service name, e.g. "wanderlog-service"
      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:          ${{ steps.task-def.outputs.task-definition }}
          service:                  ${{ secrets.ECS_SERVICE }}
          cluster:                  ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── 8. Print the ALB URL on success ──────────────────────────────────────
      - name: Print app URL
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName,'wanderlog')].DNSName" \
            --output text 2>/dev/null || echo "Check AWS Console → EC2 → Load Balancers")
          echo "App is live at: http://$ALB_DNS"
